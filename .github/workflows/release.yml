name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification:
    name: Verify release commit
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.ref }}

  release:
    name: Publish verified tag
    needs:
      - verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tag and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid SemVer release tag: ${TAG}" >&2
            exit 1
          fi
          test "$(git cat-file -t "${TAG}")" = "tag"
          test -s .github/allowed_signers
          git config gpg.ssh.allowedSignersFile "${GITHUB_WORKSPACE}/.github/allowed_signers"
          git verify-tag "${TAG}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${TAG}^{commit}" origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${TAG}^{commit}")"

          version="${TAG#v}"
          grep -Eq "^## \[${version//./\\.}\]([[:space:]]|$)" CHANGELOG.md

      - name: Extract required changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          version="${TAG#v}"
          awk -v version="${version}" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md >release-notes.md
          grep -q '[^[:space:]]' release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --verify-tag \
            --title "${TAG}" \
            --notes-file release-notes.md
